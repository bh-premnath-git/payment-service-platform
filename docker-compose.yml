x-svc-env: &svc_env
  

x-extra-hosts: &extra_hosts
  - "host.docker.internal:host-gateway"

x-db-deploy: &db_deploy
  resources:
    limits:
      cpus: "2.00"
      memory: 2G

x-support-deploy: &support_deploy
  resources:
    limits:
      cpus: "1.00"
      memory: 1G

x-light_deploy: &light_deploy
  resources:
    limits:
      cpus: "0.25"
      memory: 256M

x-default_deploy: &default_deploy
  resources:
    limits:
      cpus: "0.50"
      memory: 512M

x-worker_deploy: &worker_deploy
  resources:
    limits:
      cpus: "0.75"
      memory: 768M

networks:
  edge:
    driver: bridge

services:
  mysql:
    image: mysql:8.0.43-debian
    ports:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./conf/mysql/scripts:/docker-entrypoint-initdb.d
      - ./conf/mysql/conf/my.cnf:/etc/mysql/mysql.conf.d/my.cnf
    ulimits:
      nofile:
        soft: 20000
        hard: 40000
    command: [--ssl=0]
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -uroot -proot && [ -f /var/lib/mysql/initialization-complete.flag ]"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
  is-as-km:
    build: ./dockerfiles/is-as-km
    healthcheck:
      test: ["CMD", "curl", "--fail", "https://localhost:9444/api/health-check/v1.0/health"]
      interval: 10s
      start_period: 180s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./conf/is-as-km:/home/wso2carbon/wso2-config-volume
    ports:
      - "9444:9444"
  api-manager:
    build: ./dockerfiles/apim
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9763/services/Version"]
      interval: 10s
      start_period: 180s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      is-as-km:
        condition: service_healthy
    volumes:
      - ./conf/apim:/home/wso2carbon/wso2-config-volume
    ports:
      - "9443:9443"
      - "8280:8280"
      - "8243:8243"
