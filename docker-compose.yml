services:
  postgres:
    image: postgres:16.10-alpine3.21
    container_name: postgres-wso2
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_MAX_CONNECTIONS: 300
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    volumes:
      - ./conf/postgres/scripts:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wso2-network

  wso2is:
    image: wso2/wso2is:7.1.0-alpine
    container_name: wso2is
    hostname: wso2carbon
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Note: -Dsetup removed - causes transaction errors with PostgreSQL
      # Tables are created by complete-setup.sh script instead
      JAVA_OPTS: "-Xms512m -Xmx2048m"
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
      TZ: "GMT"
    volumes:
      - ./conf/is/repository/conf/deployment.toml:/home/wso2carbon/wso2is-7.1.0/repository/conf/deployment.toml
      - ./dockerfiles/is/postgres-connector/postgresql-42.7.4.jar:/home/wso2carbon/wso2is-7.1.0/repository/components/lib/postgresql-42.7.4.jar:ro
    ports:
      - "9443:9443"
    healthcheck:
      test: ["CMD", "curl", "-k", "--fail", "https://localhost:9443/api/health-check/v1.0/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - wso2-network

  wso2apim:
    image: wso2/wso2am:4.5.0
    container_name: wso2apim
    depends_on:
      postgres:
        condition: service_healthy
      wso2is:
        condition: service_healthy
    entrypoint: ["/docker-entrypoint-wrapper.sh"]
    environment:
      # Note: -Dsetup removed - tables created via init script
      JAVA_OPTS: "-Xms512m -Xmx2048m"
    volumes:
      - ./conf/apim/repository/conf/deployment.toml:/home/wso2carbon/wso2am-4.5.0/repository/conf/deployment.toml
      - ./dockerfiles/apim/postgres-connector/postgresql-42.7.4.jar:/home/wso2carbon/wso2am-4.5.0/repository/components/lib/postgresql-42.7.4.jar:ro
      - ./dockerfiles/apim/docker-entrypoint-wrapper.sh:/docker-entrypoint-wrapper.sh:ro
    ports:
      - "9444:9443"
      - "8280:8280"
      - "8243:8243"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9763/services/Version"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - wso2-network

  # Python microservice example
  payment-api:
    build: ./services/payment-service
    container_name: payment-api
    environment:
      DATABASE_URL: "postgresql://wso2user:wso2pass@postgres:5432/wso2am_db"
      OAUTH_ISSUER: "https://wso2is:9443/oauth2/token"
      OAUTH_JWKS_URL: "https://wso2is:9443/oauth2/jwks"
    ports:
      - "8000:8000"
    depends_on:
      wso2is:
        condition: service_healthy
    networks:
      - wso2-network

networks:
  wso2-network:
    driver: bridge

volumes:
  postgres-data: