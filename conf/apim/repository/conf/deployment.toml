[server]
hostname = "wso2apim"
base_path = "https://$ref{server.hostname}:${carbon.management.port}"
server_role = "default"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[user_store]
type = "database_unique_id"

# PostgreSQL Configuration for APIM Database
[database.apim_db]
type = "postgre"
url = "jdbc:postgresql://postgres:5432/wso2am_db"
username = "wso2user"
password = "wso2pass"
driver = "org.postgresql.Driver"

[database.apim_db.pool_options]
maxActive = 100
maxWait = 60000
minIdle = 5
testOnBorrow = true
validationQuery = "SELECT 1"
validationInterval = 30000

# PostgreSQL Configuration for Shared Database
[database.shared_db]
type = "postgre"
url = "jdbc:postgresql://postgres:5432/wso2shared_db"
username = "wso2user"
password = "wso2pass"
driver = "org.postgresql.Driver"

[database.shared_db.pool_options]
maxActive = 100
maxWait = 60000
minIdle = 5
testOnBorrow = true
validationQuery = "SELECT 1"
validationInterval = 30000

# Keystore Configuration
[keystore.tls]
file_name = "wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

# Gateway Configuration
[apim.gateway]
gateway_type = "Regular"

[[apim.gateway.environment]]
name = "Default"
type = "hybrid"
gateway_type = "Regular"
provider = "wso2"
display_in_api_console = true
description = "This is a hybrid gateway that handles both production and sandbox token traffic."
show_as_token_endpoint_url = false
service_url = "https://wso2apim:9443/services/"
ws_endpoint = "ws://wso2apim:9099"
wss_endpoint = "wss://wso2apim:8099"
http_endpoint = "http://wso2apim:8280"
https_endpoint = "https://wso2apim:8243"

# Key Manager Configuration (WSO2 IS as Key Manager)
[apim.key_manager]
service_url = "https://wso2is:9443/services/"
type = "WSO2-IS"

# CORS Configuration
[apim.cors]
allow_origins = "*"
allow_methods = ["GET","PUT","POST","DELETE","PATCH","OPTIONS"]
allow_headers = ["authorization","Access-Control-Allow-Origin","Content-Type","SOAPAction","apikey","Internal-Key"]
allow_credentials = false

# OAuth Configuration
[apim.oauth_config]
enable_outbound_auth_header = false
auth_header = "Authorization"
revoke_endpoint = "https://wso2is:9443/oauth2/revoke"
enable_token_encryption = false
enable_token_hashing = false

# Throttling Configuration
[apim.throttling]
enable_data_publishing = true
enable_policy_deploy = true
enable_blacklist_condition = true
enable_persistence = true
throttle_decision_endpoints = ["tcp://wso2apim:5672"]

[[apim.throttling.url_group]]
traffic_manager_urls = ["tcp://wso2apim:9611"]
traffic_manager_auth_urls = ["ssl://wso2apim:9711"]

# Analytics (Optional - Choreo)
[apim.analytics]
enable = false
# To enable, get on-prem key from https://analytics.choreo.dev/
# auth_token = "YOUR_CHOREO_TOKEN"

# Event Listener
[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1

[event_listener.properties]
notification_endpoint = "https://wso2apim:9443/internal/data/v1/notify"
username = "${admin.username}"
password = "${admin.password}"
'header.X-WSO2-KEY-MANAGER' = "WSO2-IS"
